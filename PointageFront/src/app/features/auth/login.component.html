<div class="login-page">
      <div class="login-card">
        <header class="login-header">
          <div class="brand-badge" aria-hidden="true">
            <span class="material-symbols-outlined">satellite_alt</span>
          </div>
          <h1 class="login-title">GeoFleet Supervision</h1>
          <p class="login-sub">Plateforme de Gestion et de Suivi GPS des Flottes</p>
        </header>

        <!-- Role Quick Switcher for Demo (local only, does NOT mutate session until login) -->
        <div class="demo-role-select" role="region" aria-label="Sélection du rôle de démonstration">
          <span class="demo-label">Connexion rapide par rôle (Démo) :</span>
          <div class="role-chips" role="radiogroup" aria-label="Rôle">
            <button
              type="button"
              (click)="selectRole('ADMIN')"
              [class.active]="selectedRole === 'ADMIN'"
              class="role-chip"
              role="radio"
              [attr.aria-checked]="selectedRole === 'ADMIN'"
            >
              <span class="material-symbols-outlined" aria-hidden="true">admin_panel_settings</span>
              <span>Admin</span>
            </button>
            <button
              type="button"
              (click)="selectRole('AGENT')"
              [class.active]="selectedRole === 'AGENT'"
              class="role-chip"
              role="radio"
              [attr.aria-checked]="selectedRole === 'AGENT'"
            >
              <span class="material-symbols-outlined" aria-hidden="true">verified_user</span>
              <span>Agent Contrôle</span>
            </button>
            <button
              type="button"
              (click)="selectRole('DRIVER')"
              [class.active]="selectedRole === 'DRIVER'"
              class="role-chip"
              role="radio"
              [attr.aria-checked]="selectedRole === 'DRIVER'"
            >
              <span class="material-symbols-outlined" aria-hidden="true">local_shipping</span>
              <span>Chauffeur</span>
            </button>
          </div>
        </div>

        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <label for="login-username">Identifiant ou e-mail</label>
            <div class="input-with-icon">
              <span class="material-symbols-outlined input-icon" aria-hidden="true">person</span>
              <input
                id="login-username"
                type="text"
                [(ngModel)]="username"
                name="username"
                required
                class="form-input"
                placeholder="nom@entreprise.sn"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Mot de passe</label>
            <div class="input-with-icon">
              <span class="material-symbols-outlined input-icon" aria-hidden="true">lock</span>
              <input
                id="login-password"
                type="password"
                [(ngModel)]="password"
                name="password"
                required
                class="form-input"
                placeholder="••••••••••••"
                autocomplete="current-password"
              />
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
              <span>Mémoriser la session</span>
            </label>
            <a href="javascript:void(0)" class="forgot-link" (click)="onForgotPassword()">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-submit">
            <span>Accéder à la plateforme</span>
            <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
          </button>
        </form>
      </div>
    </div>
